version: '3.8'

# Configuration Docker Compose avec Let's Encrypt (Certbot)
# Pour la production avec certificats SSL automatiques

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: maquettes-mui
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    volumes:
      # Certificats Let's Encrypt
      - certbot-certs:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
      # Configuration nginx avec Let's Encrypt
      - ./nginx-letsencrypt.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - certbot

  certbot:
    image: certbot/certbot:latest
    container_name: certbot
    volumes:
      - certbot-certs:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    # Renouvellement automatique tous les 12h
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  certbot-certs:
  certbot-www:
